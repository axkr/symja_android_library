# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Maven build Pull-Request

on:
  pull_request:
    branches: [ master ]

env:
  # Tests: run the fast tier only, so this job stays inside its budget. The slow and
  # corpus tiers are developer-triggered, see CONTRIBUTING.md. This repeats the default set in
  # symja_android_library/pom.xml on purpose: CI must not silently start running them.
  MAVEN_ARGS: --batch-mode --no-transfer-progress -Dsymja.test.excludedGroups=slow,corpus

jobs:
  maven-build-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7

    - name: Set up Java
      uses: ./.github/actions/setup-java-for-deployment

    - run: mvn verify
      working-directory: symja_android_library

    # Fails the build when a single test outgrows the fast tier, naming the test and
    # telling the author to tag it @Tag(TestTags.SLOW). Runs even on a red build so a
    # slow test is reported alongside whatever else broke.
    - name: Check test-time budget
      if: always()
      run: python3 .github/scripts/check-test-budget.py

    - uses: actions/upload-artifact@v7
      with:
        name: Package
        path: '**/target/*.jar'
