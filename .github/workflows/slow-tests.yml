# The slow test tier, on demand only.
#
# The pull-request build runs the fast tier so it stays inside its budget, which means
# nothing catches a regression in the slow tier until somebody runs it. This job is that
# somebody: it never triggers on its own, only from the "Run workflow" button.
#
# The Rubi corpus is deliberately not here - it is a scoreboard whose failures are
# expected, and it takes about half an hour. Run it locally:
#   mvn -pl matheclipse-io test -Prubi-corpus -Dsurefire.timeout=5400

name: Slow tests (manual)

on: workflow_dispatch

env:
  # No excludedGroups flag here on purpose: this job is the one that runs the slow tier.
  MAVEN_ARGS: --batch-mode --no-transfer-progress

jobs:
  slow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v7

    - name: Set up Java
      uses: ./.github/actions/setup-java-for-deployment

    # Symja's evaluation time budgets are tuned on a fast developer machine. A budget that
    # runs out looks exactly like a method that does not apply, so an unscaled budget makes
    # answers quietly worse on a slower runner rather than merely slower.
    - run: mvn verify -Pall-tests -Dsymja.machineProfile=slow
      working-directory: symja_android_library
